name: Fabriquer l'appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le dossier Android
        run: |
          flutter create --org com.wifensor --project-name wifensor --platforms=android .
          rm -rf test
          python3 tool/patch_android.py

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Fabriquer l'APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk Wifensor.apk
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Wifensor-leger-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Wifensor-leger-ancien.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wifensor-apk
          path: Wifensor*.apk

      - name: Publier en téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wifensor (essai ${{ github.run_number }})
          body: |
            Wifensor-leger-arm64.apk : version légère pour la plupart des téléphones récents.
            Wifensor-leger-ancien.apk : version légère pour les téléphones plus anciens.
            Wifensor.apk : version complète (marche partout, plus lourde).
          files: Wifensor*.apk
