name: Fabriquer l'appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le dossier Android
        run: |
          flutter create --org com.wifensor --project-name wifensor --platforms=android .
          rm -rf test
          python3 tool/patch_android.py

      - name: Clé de signature fixe (mêmes clés pour toutes les versions)
        env:
          WIFENSOR_KEY_PASSWORD: ${{ secrets.WIFENSOR_KEY_PASSWORD }}
        run: |
          if [ -z "$WIFENSOR_KEY_PASSWORD" ]; then
            echo "::error::Le secret WIFENSOR_KEY_PASSWORD manque : ajoute-le dans Settings › Secrets and variables › Actions."
            exit 1
          fi
          mkdir -p ~/.android
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/wifensor-key.enc -out ~/.android/debug.keystore \
            -pass env:WIFENSOR_KEY_PASSWORD
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA-256"

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Fabriquer l'APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk Wifensor.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wifensor-apk
          path: Wifensor.apk

      - name: Publier en téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wifensor (essai ${{ github.run_number }})
          body: Wifensor.apk fonctionne sur tous les téléphones Android 7 et plus récents, toutes marques.
          files: |
            Wifensor.apk
            store/icon.png
